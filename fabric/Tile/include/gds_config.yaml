#NOTE: This just needs to be set to a value bigger than the tile size
PL_MAX_DISPLACEMENT_X: 1000
PL_MAX_DISPLACEMENT_Y: 1000

SYNTH_STRATEGY: "AREA 2"

FP_SIZING: "absolute"

DESIGN_REPAIR_BUFFER_INPUT_PORTS: False
DESIGN_REPAIR_BUFFER_OUTPUT_PORTS: False

PL_TIMING_DRIVEN: False

CLOCK_PERIOD: 20.0
CLOCK_PORT: "UserCLK"

GRT_ANTENNA_REPAIR_ITERS: 10
GRT_ALLOW_CONGESTION: True

DRT_ANTENNA_REPAIR_ITERS: 10

PDN_MULTILAYER: False
PDN_EXTEND_TO: "boundary"

BOTTOM_MARGIN_MULT: 1
TOP_MARGIN_MULT: 1
LEFT_MARGIN_MULT: 6
RIGHT_MARGIN_MULT: 6

DIODE_ON_PORTS: "both"

pdk::sky130A:
  #Floor planning
  IO_PIN_H_LAYER: "met3"
  IO_PIN_V_LAYER: "met2"

  # Routing
  RT_MAX_LAYER: met4

  # PDN
  PDN_VSPACING: 3.7
  PDN_VPITCH: 30
  PDN_VOFFSET: 5

  PDN_HSPACING: 3.7
  PDN_HPITCH: 30
  PDN_HOFFSET: 5

pdk::ihp-sg13g2:
  # Port diodes land on UserCLK too; recent OpenROAD CTS then treats the
  # diode as a clock sink and latency balancing explodes (30k delay buffers
  # on LUT4AB). Antenna repair after global routing still covers the ports.
  DIODE_ON_PORTS: "none"

  # OpenROAD master returns dbTechLayer::getArea() in DBU^2 (was um^2), so the
  # pin-length fallback in tile_io_place.py comes out 1e6x too long (360 mm
  # pins -> GRT-0080). Pin length = min area / pin width = 0.144 / 0.4 um.
  IO_PIN_V_LENGTH: 0.36
  IO_PIN_H_LENGTH: 0.36

  # Routing
  RT_MAX_LAYER: TopMetal1

  DIODE_CELL: "sg13g2_antennanp/A"

  # Metal2 density straps (pdn_m2_density.tcl) are enabled per tile in the
  # large interior tiles only (LUT4AB, RegFile, DSP, RAM_IO). In W_IO and the
  # thin N/S terminators they broke Magic (W_IO: "DEF read: Pin specified
  # without layer"; N_term_RAM_IO: SPICE extraction) and those strips hardly
  # weigh in an 800 um density window.

pdk::gf180mcuD:
  # Routing
  RT_MAX_LAYER: Metal4

  # PDN
  PDN_VPITCH: 100

  SYNTH_LATCH_MAP: "dir::../../../include/gf180mcuD_latchmap.v"
